[package]
name = "rtc-crypto"
version.workspace = true
authors.workspace = true
edition.workspace = true
description = "Provider-neutral cryptography for the webrtc-rs RTC stack"
license.workspace = true
documentation = "https://docs.rs/rtc-crypto"
homepage.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"

[features]
default = ["crypto-ring"]
crypto-ring = ["dep:ring", "dep:aes", "dep:ctr", "dep:ccm", "dep:md-5", "dep:hmac", "dep:sha1", "dep:rsa", "dep:sha2", "dep:cbc"]
crypto-aws-lc-rs = ["dep:aws-lc-rs", "dep:aes", "dep:ctr", "dep:ccm", "dep:md-5", "dep:hmac", "dep:sha1", "dep:rsa", "dep:sha2", "dep:cbc"]
test-support = []

[dependencies]
aes = { workspace = true, optional = true }
ctr = { workspace = true, optional = true }
cbc = { version = "0.1.2", optional = true }
rand.workspace = true
rsa = { version = "0.9.10", default-features = false, features = ["std", "u64_digit"], optional = true }
sha2 = { version = "0.10.9", features = ["oid"], optional = true }
ccm = { workspace = true, optional = true }
md-5 = { workspace = true, optional = true }
hmac = { workspace = true, optional = true }
sha1 = { workspace = true, optional = true }
subtle.workspace = true
thiserror.workspace = true
zeroize.workspace = true
ring = { workspace = true, optional = true }
aws-lc-rs = { workspace = true, optional = true }

[dev-dependencies]
pem.workspace = true
